<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Коллективный разум · Смена полотен</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #050505;
            color: #fff;
            overflow-x: hidden;
        }

        /* ===== ПРОКРУТОЧНОЕ ПРОСТРАНСТВО ===== */
        .scroll-container {
            position: relative;
            height: 500vh;
        }

        /* ===== ФИКСИРОВАННЫЙ ВЬЮПОРТ ===== */
        .stage {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* ===== ПРОГРЕСС-БАР ИЗ МИНИ-БЛОКОВ ===== */
        .brain-bar {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 4px;
            align-items: stretch;
            padding: 8px 12px;
            background: rgba(12, 12, 12, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 28px;
            backdrop-filter: blur(20px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            pointer-events: auto;
            max-width: 95vw;
            overflow-x: auto;
        }

        .brain-mini {
            flex-shrink: 0;
            width: 130px;
            padding: 8px 10px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #555;
            font-size: 9px;
            font-weight: 500;
            text-align: center;
            transition: all 0.7s cubic-bezier(0.22, 0.61, 0.36, 1);
            opacity: 0.0935;
            transform: scale(0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            line-height: 1.25;
        }

        .brain-mini.visible {
            opacity: 0.485;
            transform: scale(1);
            background: rgba(0, 255, 195, 0.05);
            border-color: rgba(0, 255, 195, 0.2);
            color: #bbb;
        }

        .brain-mini.active-step {
            opacity: 1;
            transform: scale(1.08);
            background: rgba(0, 255, 195, 0.1);
            border-color: #00ffc3;
            color: #fff;
            box-shadow: 0 0 24px rgba(0, 255, 195, 0.2);
        }

        .brain-mini .mini-title {
            font-weight: 700;
            font-size: 12px;
            color: inherit;
        }

        .brain-mini .mini-sub {
            font-size: 9px;
            color: inherit;
            opacity: 0.7;
        }

        .brain-mini .mini-tag {
            display: inline-block;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 2px 8px;
            font-size: 8px;
            margin-top: 2px;
        }

        .brain-mini.active-step .mini-title {
            color: #00ffc3;
        }

        .brain-arrow {
            flex-shrink: 0;
            color: rgba(255, 255, 255, 0.15);
            font-size: 14px;
            display: flex;
            align-items: center;
            transition: color 0.5s;
        }

        .brain-arrow.lit {
            color: rgba(0, 255, 195, 0.5);
        }

        /* ===== СЕКЦИЯ (ОДНО ПОЛОТНО) ===== */
        .panel {
            position: absolute;
            width: 88vw;
            max-width: 1000px;
            padding: 56px 48px;
            background: rgba(12, 12, 12, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 32px;
            backdrop-filter: blur(20px);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.7);
            z-index: 1;
            transform: translateY(120px) scale(0.88);
            opacity: 0;
            transition: transform 0.9s cubic-bezier(0.22, 0.61, 0.36, 1),
                opacity 0.7s cubic-bezier(0.22, 0.61, 0.36, 1);
            pointer-events: none;
        }

        .panel.active {
            transform: translateY(0) scale(1);
            opacity: 1;
            pointer-events: auto;
        }

        .panel.exit {
            transform: translateY(-60px) scale(0.82);
            opacity: 0;
            pointer-events: none;
        }

        /* ===== ЧАСТИЦЫ ФОН ===== */
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* ===== ТИПОГРАФИКА ===== */
        h1 {
            font-size: clamp(36px, 6vw, 64px);
            line-height: 1.15;
            margin-bottom: 12px;
        }

        h2 {
            font-size: clamp(26px, 4vw, 42px);
            margin-bottom: 16px;
        }

        .sub {
            color: #999;
            font-size: 17px;
            margin-bottom: 8px;
        }

        .accent {
            color: #00ffc3;
        }

        .gold {
            color: #f0a500;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 13px 28px;
            border-radius: 50px;
            background: #00ffc3;
            color: #000;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: .3s;
        }

        .btn:hover {
            box-shadow: 0 0 28px rgba(0, 255, 195, 0.5);
            transform: translateY(-2px);
        }

        .grid-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 20px;
        }

        .tag {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid #2a2a2a;
            padding: 12px 22px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            transition: .3s;
        }

        .tag:hover {
            border-color: #00ffc3;
            background: rgba(0, 255, 195, 0.05);
        }

        .name-block {
            margin-top: 20px;
        }

        .name-block b {
            font-size: 22px;
        }

        .name-block span {
            display: block;
            color: #777;
            font-size: 15px;
            margin-top: 4px;
        }

        .scroll-indicator {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            color: #555;
            font-size: 13px;
            z-index: 10;
            pointer-events: none;
            transition: opacity 0.4s;
        }

        footer {
            position: fixed;
            bottom: 8px;
            width: 100%;
            text-align: center;
            color: #444;
            font-size: 12px;
            z-index: 5;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            .panel {
                padding: 36px 24px;
                width: 94vw;
            }

            .brain-bar {
    gap: 3px;
    padding: 5px 6px;
}

            .brain-mini {
    width: 60px;           /* было 90px — уменьшил */
    padding: 5px 6px;      /* было 6px 8px */
    border-radius: 12px;
    font-size: 8px;
    gap: 1px;
}
.brain-mini .mini-title {
    font-size: 9px;        /* было 10px */
}
.brain-mini .mini-sub {
    font-size: 6px;        /* было 7px */
}
.brain-mini .mini-tag {
    font-size: 6px;
    padding: 1px 4px;
}

            .brain-arrow {
                font-size: 10px;
            }
        }
    </style>
</head>

<body>

    <canvas id="bg"></canvas>

    <div class="stage" id="stage">
        <!-- Прогресс-бар из мини-моделей блоков -->
        <div class="brain-bar" id="brainBar"></div>
    </div>

    <div class="scroll-container" id="scrollContainer"></div>

    <div class="scroll-indicator" id="scrollIndicator">↓ скролль</div>
    <footer>Ренат Ахатов · Коллективный разум · t.me/rvtst</footer>

    <script>
        /* ===== ЧАСТИЦЫ ===== */
        const canvas = document.getElementById('bg');
        const ctx = canvas.getContext('2d');
        let w, h;
        let mouse = { x: -1000, y: -1000 };

        function resizeCanvas() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        window.addEventListener('mouseleave', () => {
            mouse.x = -1000;
            mouse.y = -1000;
        });

        const particles = [];
        for (let i = 0; i < 70; i++) {
            particles.push({
                x: Math.random() * w,
                y: Math.random() * h,
                vx: (Math.random() - 0.5) * 0.4,
                vy: (Math.random() - 0.5) * 0.4,
                r: Math.random() * 2 + 0.8
            });
        }

        function drawParticles() {
            ctx.clearRect(0, 0, w, h);
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < -10) p.x = w + 10;
                if (p.x > w + 10) p.x = -10;
                if (p.y < -10) p.y = h + 10;
                if (p.y > h + 10) p.y = -10;

                const dx = mouse.x - p.x;
                const dy = mouse.y - p.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 140 && dist > 0) {
                    const f = (140 - dist) / 140;
                    p.x -= dx * f * 0.025;
                    p.y -= dy * f * 0.025;
                }

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 255, 195, 0.55)';
                ctx.fill();
            });

            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const d = Math.sqrt(dx * dx + dy * dy);
                    if (d < 120) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle =
                            `rgba(0,255,195,${0.05*(1-d/120)})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(drawParticles);
        }
        drawParticles();

        /* ===== ПАНЕЛИ ===== */
        const stage = document.getElementById('stage');
        const scrollContainer = document.getElementById('scrollContainer');
        const scrollIndicator = document.getElementById('scrollIndicator');
        const brainBar = document.getElementById('brainBar');

        const panelsData = [
            {
                html: `
                    <h1>Коллективный<br>разум</h1>
                    <div class="sub" style="font-size:20px;color:#ccc;">Не совсем студия</div>
                    <div class="sub" style="margin-top:10px;">Делаю сайты и AI-системы быстрее,<br>чем это обычно происходит</div>
                    <div class="sub" style="margin-top:8px;font-size:14px;color:#666;">↓ скролль вниз</div>
                `,
                mini: {
                    title: 'Коллективный разум',
                    sub: 'Не совсем студия',
                    tag: 'Старт'
                }
            },
            {
                html: `
                    <h2>Команда без лишнего шума</h2>
                    <div class="grid-tags">
                        <div class="tag">Архитектура</div>
                        <div class="tag">Дизайн</div>
                        <div class="tag">Разработка</div>
                        <div class="tag">AI</div>
                        <div class="tag">Деплой</div>
                    </div>
                `,
                mini: {
                    title: 'Команда',
                    sub: 'Без лишнего шума',
                    tag: 'Ядро'
                }
            },
            {
                html: `
                    <h2>На самом деле — <span class="accent">один человек</span></h2>
                    <div class="sub" style="font-size:18px;">Без менеджеров · Без передачи задач</div>
                    <div class="name-block">
                        <b>Ренат Ахатов</b>
                        <span>Tech-директор · AI-инженер</span>
                    </div>
                `,
                mini: {
                    title: 'Один человек',
                    sub: 'Ренат Ахатов',
                    tag: 'Истина'
                }
            },
            {
                html: `
                    <h2>Проекты</h2>
                    <div class="grid-tags">
                        <div class="tag">Три богатыря: сайт·бот·PDF</div>
                        <div class="tag">Биохакинг: автоматизация</div>
                        <div class="tag">AI-аватар: голос·логика</div>
                    </div>
                    <div class="sub" style="margin-top:16px;">5 дней от идеи до деплоя</div>
                `,
                mini: {
                    title: 'Проекты',
                    sub: '5 дней до деплоя',
                    tag: 'Опыт'
                }
            },
            {
                html: `
                    <h2>Вам не нужна команда</h2>
                    <div class="sub" style="font-size:20px;color:#ccc;">Вам нужен результат</div>
                    <a href="https://t.me/rvtst" class="btn">@rvtst</a>
                    <div style="margin-top:14px;font-size:14px;color:#666;">связь напрямую · без менеджеров</div>
                `,
                mini: {
                    title: 'Результат',
                    sub: 'Связь напрямую',
                    tag: 'Финал'
                }
            }
        ];

        const panels = [];
        const totalPanels = panelsData.length;

        // Создаём основные панели
        panelsData.forEach((data, i) => {
            const panel = document.createElement('div');
            panel.className = 'panel';
            panel.innerHTML = data.html;
            panel.dataset.index = i;
            stage.appendChild(panel);
            panels.push(panel);
        });

        panels[0].classList.add('active');

        /* ===== ПРОГРЕСС-БАР ИЗ МИНИ-МОДЕЛЕЙ БЛОКОВ ===== */
        const miniCards = [];
        const arrows = [];

        panelsData.forEach((data, i) => {
            // Создаём мини-карточку — уменьшенную модель блока
            const mini = document.createElement('div');
            mini.className = 'brain-mini';
            mini.innerHTML = `
                <div class="mini-title">${data.mini.title}</div>
              
            `;
            mini.dataset.index = i;
            brainBar.appendChild(mini);
            miniCards.push(mini);

            // Стрелка между блоками (кроме последнего)
            if (i < totalPanels - 1) {
                const arrow = document.createElement('div');
                arrow.className = 'brain-arrow';
                arrow.innerHTML = '→';
                brainBar.appendChild(arrow);
                arrows.push(arrow);
            }
        });

        /* ===== ЛОГИКА СКРОЛЛА ===== */
        const panelHeight = window.innerHeight;
        const totalScrollHeight = panelHeight * totalPanels;
        scrollContainer.style.height = totalScrollHeight + 'px';

        let currentActive = 0;

        function updateProgressBar(activeIndex) {
            // Обновляем мини-карточки
            miniCards.forEach((mini, idx) => {
                mini.classList.remove('visible', 'active-step');

                if (idx < activeIndex) {
                    // Уже просмотрена
                    mini.classList.add('visible');
                } else if (idx === activeIndex) {
                    // Текущая
                    mini.classList.add('active-step');
                }
            });

            // Подсвечиваем стрелки между просмотренными блоками
            arrows.forEach((arrow, idx) => {
                if (idx < activeIndex) {
                    arrow.classList.add('lit');
                } else {
                    arrow.classList.remove('lit');
                }
            });
        }

        function updatePanels() {
            const scrollY = window.scrollY;
            const rawIndex = scrollY / panelHeight;
            const activeIndex = Math.min(Math.floor(rawIndex), totalPanels - 1);
            const progress = rawIndex - activeIndex;

            if (activeIndex !== currentActive) {
                panels.forEach(p => {
                    p.classList.remove('active', 'exit');
                    p.style.transform = '';
                    p.style.opacity = '';
                });

                panels[activeIndex].classList.add('active');

                if (currentActive < panels.length && currentActive !== activeIndex) {
                    panels[currentActive].classList.add('exit');
                }

                currentActive = activeIndex;
                updateProgressBar(activeIndex);
            }

            if (progress > 0.5 && activeIndex < totalPanels - 1) {
                const fadeProgress = (progress - 0.5) * 2;
                panels[activeIndex].style.transform =
                    `translateY(${-50 * fadeProgress}px) scale(${1 - 0.12 * fadeProgress})`;
                panels[activeIndex].style.opacity = 1 - fadeProgress * 0.85;
            } else {
                panels[activeIndex].style.transform = 'translateY(0) scale(1)';
                panels[activeIndex].style.opacity = '1';
            }

            if (scrollY < 100) {
                scrollIndicator.style.opacity = '1';
            } else {
                scrollIndicator.style.opacity = '0';
            }
        }

        window.addEventListener('scroll', updatePanels);
        window.addEventListener('resize', () => {
            const newPanelHeight = window.innerHeight;
            scrollContainer.style.height = (newPanelHeight * totalPanels) + 'px';
            updatePanels();
        });

        // Старт
        updatePanels();
        updateProgressBar(0);
    </script>

</body>
</html>
