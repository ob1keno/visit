<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Коллективный разум · Смена полотен</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #050505;
            color: #fff;
            overflow-x: hidden;
        }

        /* ===== ПРОКРУТОЧНОЕ ПРОСТРАНСТВО ===== */
        .scroll-container {
            position: relative;
            height: 500vh;
            /* 5 секций */
        }

        /* ===== ФИКСИРОВАННЫЙ ВЬЮПОРТ ===== */
        .stage {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* ===== СЕКЦИЯ (ОДНО ПОЛОТНО) ===== */
        .panel {
            position: absolute;
            width: 88vw;
            max-width: 1000px;
            padding: 56px 48px;
            background: rgba(12, 12, 12, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 32px;
            backdrop-filter: blur(20px);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.7);

            /* начальное состояние — скрыто снизу */
            transform: translateY(120px) scale(0.88);
            opacity: 0;
            transition: transform 0.9s cubic-bezier(0.22, 0.61, 0.36, 1),
                opacity 0.7s cubic-bezier(0.22, 0.61, 0.36, 1);
            pointer-events: none;
        }

        /* активная панель */
        .panel.active {
            transform: translateY(0) scale(1);
            opacity: 1;
            pointer-events: auto;
        }

        /* уходящая панель (уменьшается и исчезает) */
        .panel.exit {
            transform: translateY(-60px) scale(0.82);
            opacity: 0;
            pointer-events: none;
        }

        /* ===== ЧАСТИЦЫ ФОН ===== */
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* ===== ТИПОГРАФИКА ===== */
        h1 {
            font-size: clamp(36px, 6vw, 64px);
            line-height: 1.15;
            margin-bottom: 12px;
        }

        h2 {
            font-size: clamp(26px, 4vw, 42px);
            margin-bottom: 16px;
        }

        .sub {
            color: #999;
            font-size: 17px;
            margin-bottom: 8px;
        }

        .accent {
            color: #00ffc3;
        }

        .gold {
            color: #f0a500;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 13px 28px;
            border-radius: 50px;
            background: #00ffc3;
            color: #000;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: .3s;
        }

        .btn:hover {
            box-shadow: 0 0 28px rgba(0, 255, 195, 0.5);
            transform: translateY(-2px);
        }

        .grid-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 20px;
        }

        .tag {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid #2a2a2a;
            padding: 12px 22px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            transition: .3s;
        }

        .tag:hover {
            border-color: #00ffc3;
            background: rgba(0, 255, 195, 0.05);
        }

        .name-block {
            margin-top: 20px;
        }

        .name-block b {
            font-size: 22px;
        }

        .name-block span {
            display: block;
            color: #777;
            font-size: 15px;
            margin-top: 4px;
        }

        /* скролл-индикатор */
        .scroll-indicator {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            color: #555;
            font-size: 13px;
            z-index: 10;
            pointer-events: none;
            transition: opacity 0.4s;
        }

        footer {
            position: fixed;
            bottom: 8px;
            width: 100%;
            text-align: center;
            color: #444;
            font-size: 12px;
            z-index: 5;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            .panel {
                padding: 36px 24px;
                width: 94vw;
            }
        }
    </style>
</head>

<body>

    <!-- частицы -->
    <canvas id="bg"></canvas>

    <!-- сцена -->
    <div class="stage" id="stage">
        <!-- панели будут созданы в JS -->
    </div>

    <!-- прокруточное пространство -->
    <div class="scroll-container" id="scrollContainer"></div>

    <div class="scroll-indicator" id="scrollIndicator">↓ скролль</div>
    <footer>Ренат Ахатов · Коллективный разум · t.me/rvtst</footer>

    <script>
        /* ===== ЧАСТИЦЫ ===== */
        const canvas = document.getElementById('bg');
        const ctx = canvas.getContext('2d');
        let w, h;
        let mouse = { x: -1000, y: -1000 };

        function resizeCanvas() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        window.addEventListener('mouseleave', () => {
            mouse.x = -1000;
            mouse.y = -1000;
        });

        const particles = [];
        for (let i = 0; i < 70; i++) {
            particles.push({
                x: Math.random() * w,
                y: Math.random() * h,
                vx: (Math.random() - 0.5) * 0.4,
                vy: (Math.random() - 0.5) * 0.4,
                r: Math.random() * 2 + 0.8
            });
        }

        function drawParticles() {
            ctx.clearRect(0, 0, w, h);
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < -10) p.x = w + 10;
                if (p.x > w + 10) p.x = -10;
                if (p.y < -10) p.y = h + 10;
                if (p.y > h + 10) p.y = -10;

                const dx = mouse.x - p.x;
                const dy = mouse.y - p.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 140 && dist > 0) {
                    const f = (140 - dist) / 140;
                    p.x -= dx * f * 0.025;
                    p.y -= dy * f * 0.025;
                }

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 255, 195, 0.55)';
                ctx.fill();
            });

            // линии
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const d = Math.sqrt(dx * dx + dy * dy);
                    if (d < 120) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle =
                            `rgba(0,255,195,${0.05*(1-d/120)})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(drawParticles);
        }
        drawParticles();

        /* ===== ПАНЕЛИ ===== */
        const stage = document.getElementById('stage');
        const scrollContainer = document.getElementById('scrollContainer');
        const scrollIndicator = document.getElementById('scrollIndicator');

        const panelsData = [
    // 0: Хиро
    {
        html: `
            <h1>Коллективный<br>разум</h1>
            <div class="sub" style="font-size:20px;color:#ccc;">Не совсем студия</div>
            <div class="sub" style="margin-top:10px;">Делаю проекты за дни,<br>когда у других это недели</div>
            <div class="sub" style="margin-top:8px;font-size:14px;color:#666;">↓ скролль вниз</div>
        `
    },
    // 1: Команда
    {
        html: `
            <h2>Команда без лишнего шума</h2>
            <div class="grid-tags">
                <div class="tag">Архитектура</div>
                <div class="tag">Дизайн</div>
                <div class="tag">Разработка</div>
                <div class="tag">AI</div>
                <div class="tag">Деплой</div>
            </div>
        `
    },
    // 2: Разоблачение
    {
        html: `
            <h2>На самом деле — <span class="accent">один человек</span></h2>
            <div class="sub" style="font-size:18px;">Без менеджеров · Без передачи задач</div>
            <div class="sub" style="margin-top:12px; color:#aaa;">Вам не нужно управлять командой.<br>Вам нужен человек, который доведёт до результата.</div>
            <div class="name-block">
                <b>Ренат Ахатов</b>
                <span>Tech-директор · AI-инженер</span>
            </div>
        `
    },
    // 3: Проекты (обновлённые кейсы)
    {
        html: `
            <h2>Проекты</h2>
            <div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px;">
                <div style="
                    background: rgba(255,255,255,0.03);
                    border: 1px solid #2a2a2a;
                    padding: 18px 20px;
                    border-radius: 16px;
                    font-size: 13px;
                    font-weight: 500;
                    cursor: pointer;
                    transition: .3s;
                    flex: 1 1 calc(50% - 6px);
                    min-width: 180px;
                    display: flex;
                    align-items: flex-start;
                    gap: 12px;
                " onclick="window.open('https://t.me/rvtst','_blank')"
                   onmouseenter="this.style.borderColor='#00ffc3';this.style.background='rgba(0,255,195,0.06)';this.style.transform='translateY(-2px)';"
                   onmouseleave="this.style.borderColor='#2a2a2a';this.style.background='rgba(255,255,255,0.03)';this.style.transform='translateY(0)';">
                    <span style="font-size:24px;">🤖</span>
                    <div>
                        <div style="color:#fff; font-weight:600; margin-bottom:4px;">AI-бот лаборант (Telegram)</div>
                        <div style="color:#999; font-size:12px; line-height:1.5;">Отвечает пользователям, генерирует ответы через AI</div>
                        <div style="color:#00ffc3; font-size:11px; margin-top:6px; font-weight:600;">Открыть →</div>
                    </div>
                </div>
                <div style="
                    background: rgba(255,255,255,0.03);
                    border: 1px solid #2a2a2a;
                    padding: 18px 20px;
                    border-radius: 16px;
                    font-size: 13px;
                    font-weight: 500;
                    cursor: pointer;
                    transition: .3s;
                    flex: 1 1 calc(50% - 6px);
                    min-width: 180px;
                    display: flex;
                    align-items: flex-start;
                    gap: 12px;
                " onclick="window.open('https://t.me/rvtst','_blank')"
                   onmouseenter="this.style.borderColor='#00ffc3';this.style.background='rgba(0,255,195,0.06)';this.style.transform='translateY(-2px)';"
                   onmouseleave="this.style.borderColor='#2a2a2a';this.style.background='rgba(255,255,255,0.03)';this.style.transform='translateY(0)';">
                    <span style="font-size:24px;">🌐</span>
                    <div>
                        <div style="color:#fff; font-weight:600; margin-bottom:4px;">Лендинг под ключ</div>
                        <div style="color:#999; font-size:12px; line-height:1.5;">Сайт + буклет + PDF · деплой + SEO</div>
                        <div style="color:#00ffc3; font-size:11px; margin-top:6px; font-weight:600;">Посмотреть →</div>
                    </div>
                </div>
                <div style="
                    background: rgba(255,255,255,0.03);
                    border: 1px solid #2a2a2a;
                    padding: 18px 20px;
                    border-radius: 16px;
                    font-size: 13px;
                    font-weight: 500;
                    cursor: pointer;
                    transition: .3s;
                    flex: 1 1 calc(50% - 6px);
                    min-width: 180px;
                    display: flex;
                    align-items: flex-start;
                    gap: 12px;
                " onclick="window.open('https://t.me/rvtst','_blank')"
                   onmouseenter="this.style.borderColor='#00ffc3';this.style.background='rgba(0,255,195,0.06)';this.style.transform='translateY(-2px)';"
                   onmouseleave="this.style.borderColor='#2a2a2a';this.style.background='rgba(255,255,255,0.03)';this.style.transform='translateY(0)';">
                    <span style="font-size:24px;">🏛️</span>
                    <div>
                        <div style="color:#fff; font-weight:600; margin-bottom:4px;">Сайт музея</div>
                        <div style="color:#999; font-size:12px; line-height:1.5;">Дизайн + структура · адаптив + публикация</div>
                        <div style="color:#00ffc3; font-size:11px; margin-top:6px; font-weight:600;">Посмотреть →</div>
                    </div>
                </div>
                <div style="
                    background: rgba(255,255,255,0.03);
                    border: 1px solid #2a2a2a;
                    padding: 18px 20px;
                    border-radius: 16px;
                    font-size: 13px;
                    font-weight: 500;
                    cursor: pointer;
                    transition: .3s;
                    flex: 1 1 calc(50% - 6px);
                    min-width: 180px;
                    display: flex;
                    align-items: flex-start;
                    gap: 12px;
                " onclick="window.open('https://t.me/rvtst','_blank')"
                   onmouseenter="this.style.borderColor='#00ffc3';this.style.background='rgba(0,255,195,0.06)';this.style.transform='translateY(-2px)';"
                   onmouseleave="this.style.borderColor='#2a2a2a';this.style.background='rgba(255,255,255,0.03)';this.style.transform='translateY(0)';">
                    <span style="font-size:24px;">⚙️</span>
                    <div>
                        <div style="color:#fff; font-weight:600; margin-bottom:4px;">Парсеры Telegram</div>
                        <div style="color:#999; font-size:12px; line-height:1.5;">Сбор данных · автоматизация процессов</div>
                        <div style="color:#00ffc3; font-size:11px; margin-top:6px; font-weight:600;">GitHub →</div>
                    </div>
                </div>
            </div>
            <div class="sub" style="margin-top:20px; color:#00ffc3;">5 дней от идеи до деплоя</div>
        `
    },
    // 4: CTA
    {
        html: `
            <h2>Вам не нужна команда</h2>
            <div class="sub" style="font-size:20px;color:#ccc;">Вам нужен результат</div>
            <a href="https://t.me/rvtst" class="btn">@rvtst</a>
            <div style="margin-top:14px;font-size:14px;color:#666;">связь напрямую · без менеджеров</div>
        `
    }
];
        const panels = [];
        const totalPanels = panelsData.length;

        panelsData.forEach((data, i) => {
            const panel = document.createElement('div');
            panel.className = 'panel';
            panel.innerHTML = data.html;
            panel.dataset.index = i;
            stage.appendChild(panel);
            panels.push(panel);
        });

        // Первая панель активна
        panels[0].classList.add('active');

        /* ===== ЛОГИКА СКРОЛЛА ===== */
        const panelHeight = window.innerHeight; // высота скролла на одну смену
        const totalScrollHeight = panelHeight * totalPanels;
        scrollContainer.style.height = totalScrollHeight + 'px';

        let currentActive = 0;

        function updatePanels() {
            const scrollY = window.scrollY;
            const rawIndex = scrollY / panelHeight;
            const activeIndex = Math.min(Math.floor(rawIndex), totalPanels - 1);

            // прогресс внутри текущего перехода (0..1)
            const progress = rawIndex - activeIndex;

            if (activeIndex !== currentActive) {
                // Снимаем все классы и сбрасываем инлайн-стили у всех панелей
                panels.forEach(p => {
                    p.classList.remove('active', 'exit');
                    p.style.transform = '';
                    p.style.opacity = '';
                });

                // Назначаем новой активной панели класс active
                panels[activeIndex].classList.add('active');
                
                // Панель, которая была активна, получает класс exit,
                // если она существует и не совпадает с новой активной
                if (currentActive < panels.length && currentActive !== activeIndex) {
                    panels[currentActive].classList.add('exit');
                }
                
                currentActive = activeIndex;
            }

            // Плавное угасание активной панели к концу её зоны
            if (progress > 0.5 && activeIndex < totalPanels - 1) {
                const fadeProgress = (progress - 0.5) * 2; // 0..1 во второй половине
                panels[activeIndex].style.transform =
                    `translateY(${-50 * fadeProgress}px) scale(${1 - 0.12 * fadeProgress})`;
                panels[activeIndex].style.opacity = 1 - fadeProgress * 0.85;
            } else {
                // Возвращаем к исходным значениям (важно при скролле вверх)
                panels[activeIndex].style.transform = 'translateY(0) scale(1)';
                panels[activeIndex].style.opacity = '1';
            }

            // Индикатор скролла
            if (scrollY < 100) {
                scrollIndicator.style.opacity = '1';
            } else {
                scrollIndicator.style.opacity = '0';
            }
        }

        window.addEventListener('scroll', updatePanels);
        window.addEventListener('resize', () => {
            // пересчёт высоты
            const newPanelHeight = window.innerHeight;
            scrollContainer.style.height = (newPanelHeight * totalPanels) + 'px';
            updatePanels();
        });

        // начальное состояние
        updatePanels();
    </script>

</body>
</html>
